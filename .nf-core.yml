repository_type: pipeline

nf_core_version: 4.0.2

lint:
  # Disabled: nf-core 4.0.2 cannot parse `nextflow inspect` output that
  # is prefixed with `[PIPELINE]`/`[WORKDIR]` banner lines in Nextflow 25.x.
  # Re-enable once upstream nf-core lint strips those banner lines.
  container_configs: False
  # Local utils subworkflow is a non-standard helper bundled with the template;
  # it has two workflows (PIPELINE_INITIALISATION + PIPELINE_COMPLETION) so a
  # single-name meta.yml never validates cleanly.
  subworkflow_changes:
    - subworkflows/local/utils_nfcore_epicandi_pipeline
  # False-positive: the upstream nf-core/bowtie2/align test snapshot embeds a
  # SAM quality string with 7+ consecutive `<` characters, which the lint
  # regex misidentifies as a git merge marker.
  merge_markers:
    - modules/nf-core/bowtie2/align/tests/main.nf.test.snap
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-epicandi_logo_light.png
    - docs/images/nf-core-epicandi_logo_light.png
    - docs/images/nf-core-epicandi_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-epicandi_logo_light.png
    - docs/images/nf-core-epicandi_logo_light.png
    - docs/images/nf-core-epicandi_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    # iGenomes config files removed — pipeline uses curated per-species
    # reference assets via --refs_dir / --ref_manifest instead.
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: epicandi
  name: epicandi
  description: "EpiCandi v2 \u2014 Candida spp QC/Assembly/AMR/Phylogeny pipeline"
  author: Alejandro Sanz-Carbonell
  version: 1.0.0dev
  force: true
  outdir: results
  is_nfcore: false
